<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#5865f2" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script src="/pwa.js" defer></script>
    <title>Daytrade Sim Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1a1a1a;
        --bg: #fafafa;
        --card-bg: #ffffff;
        --border: #e0e0e0;
        --accent: #5865f2;
        /* #16a34a/#dc2626 measured 3.30:1/4.83:1 on --card-bg — the green fails
           WCAG AA (4.5:1) at the 13px table-cell size (large 20px card values
           are fine at the 3:1 large-text threshold, but the same class is
           reused in dense table rows, so it has to clear the stricter bar). */
        --pos: #15803d;
        --neg: #dc2626;
        --muted: #6b7280;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e5e7eb;
          --bg: #14161c;
          --card-bg: #1c1f28;
          --border: #2c2f3a;
          --muted: #9ca3af;
          /* Light-mode --pos/--neg measured 3.28:1/3.41:1 against the dark
             card background — both fail AA here, so dark mode needs its own
             lighter shades rather than reusing the light-mode values. */
          --pos: #4ade80;
          --neg: #f87171;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      .updated {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 24px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin-bottom: 28px;
      }
      .card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 16px;
      }
      .card .label {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .card .value {
        font-size: 20px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .pos {
        color: var(--pos);
      }
      .neg {
        color: var(--neg);
      }
      section {
        margin-bottom: 32px;
      }
      section h2 {
        font-size: 15px;
        margin: 0 0 12px;
        color: var(--muted);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      .chart-wrap {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
      }
      .charts-row {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 16px;
      }
      @media (max-width: 800px) {
        .charts-row {
          grid-template-columns: 1fr;
        }
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        font-size: 13px;
      }
      th,
      td {
        padding: 8px 10px;
        text-align: right;
        border-bottom: 1px solid var(--border);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      th:first-child,
      td:first-child,
      th.text,
      td.text {
        text-align: left;
        font-variant-numeric: normal;
        white-space: normal;
      }
      th {
        cursor: pointer;
        user-select: none;
        color: var(--muted);
        font-weight: 600;
        font-size: 12px;
        /* Sort controls are the only interactive elements on the page, and
           the previous 8px/10px padding gave them a much smaller tap target
           than the ~44px minimum recommended for touch — widened vertical
           padding rather than the full 44px, which would bloat a data-dense
           table more than this page's density calls for. */
        padding: 14px 10px;
      }
      th:hover {
        color: var(--fg);
      }
      th:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
        color: var(--fg);
      }
      th .sort-arrow {
        display: inline-block;
        width: 1em;
        color: var(--accent);
      }
      tbody tr:last-child td {
        border-bottom: none;
      }
      .reason {
        color: var(--muted);
        font-size: 12px;
      }
      .table-scroll {
        overflow-x: auto;
      }
      .empty {
        color: var(--muted);
        padding: 16px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Daytrade Sim Dashboard（日本株）</h1>
    <div class="updated" id="updated">読み込み中...</div>
    <p><a href="../">← ダッシュボード一覧に戻る</a></p>

    <div class="cards" id="cards"></div>

    <section>
      <h2>資産推移</h2>
      <div class="charts-row">
        <div class="chart-wrap"><canvas id="equityChart" height="260"></canvas></div>
        <div class="chart-wrap"><canvas id="pieChart" height="260"></canvas></div>
      </div>
    </section>

    <section id="pendingSection" style="display: none">
      <h2>次回セッションで約定予定のシグナル</h2>
      <div id="pendingList" class="table-scroll"></div>
    </section>

    <section>
      <h2>保有ポジション</h2>
      <div class="table-scroll">
        <table id="positionsTable">
          <thead>
            <tr>
              <th class="text" data-key="name">銘柄</th>
              <th data-key="shares">株数</th>
              <th data-key="avgEntryPrice">平均取得単価</th>
              <th data-key="currentPrice">現在値</th>
              <th data-key="marketValue">評価額</th>
              <th data-key="unrealizedPnl">含み損益</th>
              <th data-key="tranchesHeld">段階</th>
              <th data-key="firstEntryDate">保有開始日</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section>
      <h2>売買履歴（直近から）</h2>
      <div class="table-scroll">
        <table id="tradesTable">
          <thead>
            <tr>
              <th class="text" data-key="date">日付</th>
              <th class="text" data-key="action">売買</th>
              <th class="text" data-key="name">銘柄</th>
              <th data-key="shares">株数</th>
              <th data-key="price">価格</th>
              <th data-key="realizedPnl">実現損益</th>
              <th class="text" data-key="reason">理由</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <script>
      // Read design tokens from CSS rather than duplicating hex values here,
      // so --accent has exactly one source of truth (previously unused in
      // CSS and hardcoded again in this chart's colors).
      const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      const accentColor = cssVar('--accent');
      const hexToRgba = (hex, alpha) => {
        const n = parseInt(hex.slice(1), 16);
        return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
      };

      const yen = (v) => (v === null || v === undefined ? '—' : Math.round(v).toLocaleString('ja-JP') + '円');
      const signedYen = (v) => (v === null || v === undefined ? '—' : (v >= 0 ? '+' : '') + yen(v));
      const pctStr = (v) => (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
      const posNeg = (v) => (v === null || v === undefined ? '' : v >= 0 ? 'pos' : 'neg');

      function extractRuleTag(reason) {
        const m = reason.match(/（([^（）]+)）$/);
        return m ? m[1] : reason;
      }

      // src/features/daytrade-sim/format.tsのTRANCHE_LABELと同じ呼称
      const TRANCHE_LABEL = { 1: '打診買い', 2: '追撃買い', 3: '本買い' };

      function renderPending(pendingOrders) {
        const section = document.getElementById('pendingSection');
        if (!pendingOrders || pendingOrders.length === 0) {
          section.style.display = 'none';
          return;
        }
        section.style.display = '';
        document.getElementById('pendingList').innerHTML = pendingOrders
          .map((p) => {
            const label = p.action === 'buy' ? `${TRANCHE_LABEL[p.trancheNumber] ?? '買い'}予定` : '売り予定';
            const priceNote = p.limitPrice !== undefined ? `（指値 ${yen(p.limitPrice)}）` : '（成行）';
            return `<div class="card"><div class="label">${p.name} (${p.symbol})　${p.queuedDate}検知</div><div class="value">${label}${priceNote}</div><div class="reason">${extractRuleTag(p.reason)}</div></div>`;
          })
          .join('');
      }

      function renderCards(d) {
        const s = d.summary;
        const cards = [
          { label: '現金', value: yen(s.cash) },
          { label: '評価額（現金＋ポジション）', value: yen(s.totalEquity) },
          { label: '開始来の騰落率', value: pctStr(s.changePct), cls: posNeg(s.changePct) },
          { label: '実現損益（税引前）', value: signedYen(s.realizedPnlGross), cls: posNeg(s.realizedPnlGross) },
          { label: '支払税額（累計）', value: yen(s.taxPaidTotal) },
          { label: '支払手数料（累計）', value: yen(s.commissionPaidTotal) },
          { label: '実現損益（手数料・税引後）', value: signedYen(s.realizedPnlNet), cls: posNeg(s.realizedPnlNet) },
          { label: '含み損益', value: signedYen(s.unrealizedPnl), cls: posNeg(s.unrealizedPnl) },
        ];
        document.getElementById('cards').innerHTML = cards
          .map((c) => `<div class="card"><div class="label">${c.label}</div><div class="value ${c.cls ?? ''}">${c.value}</div></div>`)
          .join('');
      }

      function dayBefore(dateStr) {
        const d = new Date(dateStr + 'T00:00:00Z');
        d.setUTCDate(d.getUTCDate() - 1);
        return d.toISOString().slice(0, 10);
      }

      function renderEquityChart(history, initialCapitalYen) {
        // 1日目からすでに含み損益が乗っていると、グラフの開始地点が0%地点からズレて見える
        // ため、前日時点=元本のダミー点を1つ足して必ず横ばいの起点から始まるようにする。
        const withStart = history.length > 0 ? [{ date: dayBefore(history[0].date), session: 'start', totalEquity: initialCapitalYen }, ...history] : history;
        const labels = withStart.map((p) => (p.session === 'start' ? `${p.date.slice(5)}開始` : `${p.date.slice(5)}${p.session === 'morning' ? '午前' : '午後'}`));
        const values = withStart.map((p) => Math.round(p.totalEquity));
        new Chart(document.getElementById('equityChart'), {
          type: 'line',
          data: {
            labels,
            datasets: [{ label: '資産評価額', data: values, borderColor: accentColor, backgroundColor: hexToRgba(accentColor, 0.15), fill: true, pointRadius: 1, tension: 0.1 }],
          },
          options: {
            plugins: { legend: { display: false }, title: { display: true, text: '資産評価額の推移（全期間）' } },
            scales: { y: { beginAtZero: false } },
          },
        });
      }

      function renderPieChart(positions) {
        const wrap = document.getElementById('pieChart').parentElement;
        if (positions.length === 0) {
          wrap.innerHTML = '<div class="empty">保有ポジションなし</div>';
          return;
        }
        const colors = positions.map((_, i) => `hsl(${Math.round((360 / positions.length) * i)}, 65%, 55%)`);
        new Chart(document.getElementById('pieChart'), {
          type: 'pie',
          data: {
            labels: positions.map((p) => `${p.name} (${p.symbol})`),
            datasets: [{ data: positions.map((p) => Math.round(p.marketValue)), backgroundColor: colors }],
          },
          options: {
            plugins: { legend: { display: false }, title: { display: true, text: '保有ポジションの内訳（時価ベース）' } },
          },
        });
      }

      function makeSortable(tableId, rows, columns, renderRow) {
        const table = document.getElementById(tableId);
        const tbody = table.querySelector('tbody');
        let sortKey = null;
        let sortDir = 1;

        function draw() {
          if (rows.length === 0) {
            tbody.innerHTML = `<tr><td colspan="${columns.length}" class="empty">データなし</td></tr>`;
            return;
          }
          tbody.innerHTML = rows.map(renderRow).join('');
        }

        const headers = table.querySelectorAll('th');
        const arrows = new Map();

        function applySort(key) {
          sortDir = sortKey === key ? -sortDir : 1;
          sortKey = key;
          rows.sort((a, b) => {
            const av = a[key];
            const bv = b[key];
            if (av === null || av === undefined) return 1;
            if (bv === null || bv === undefined) return -1;
            if (typeof av === 'string') return av.localeCompare(bv) * sortDir;
            return (av - bv) * sortDir;
          });
          headers.forEach((h) => {
            const isActive = h.dataset.key === key;
            h.setAttribute('aria-sort', isActive ? (sortDir === 1 ? 'ascending' : 'descending') : 'none');
            arrows.get(h.dataset.key).textContent = isActive ? (sortDir === 1 ? '▲' : '▼') : '';
          });
          draw();
        }

        // th isn't natively focusable/keyboard-operable — sorting was
        // mouse-only with no way to tell which column/direction was active.
        headers.forEach((th) => {
          th.setAttribute('tabindex', '0');
          th.setAttribute('role', 'button');
          th.setAttribute('aria-sort', 'none');
          const arrow = document.createElement('span');
          arrow.className = 'sort-arrow';
          th.appendChild(arrow);
          arrows.set(th.dataset.key, arrow);

          th.addEventListener('click', () => applySort(th.dataset.key));
          th.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              applySort(th.dataset.key);
            }
          });
        });

        draw();
      }

      async function main() {
        const res = await fetch('./data.json', { cache: 'no-store' });
        const d = await res.json();

        const sessionLabel = d.lastRunSession === 'morning' ? '午前' : d.lastRunSession === 'afternoon' ? '午後' : d.lastRunSession;
        document.getElementById('updated').textContent = `最終更新: ${d.lastRunDate ?? '?'} ${sessionLabel ?? ''}（データ生成 ${new Date(d.generatedAt).toLocaleString('ja-JP')}）`;

        renderCards(d);
        renderPending(d.pendingOrders);
        renderEquityChart(d.equityHistory, d.summary.initialCapitalYen);
        renderPieChart(d.positions);

        makeSortable(
          'positionsTable',
          d.positions.slice(),
          ['name', 'shares', 'avgEntryPrice', 'currentPrice', 'marketValue', 'unrealizedPnl', 'tranchesHeld', 'firstEntryDate'],
          (p) => `
            <tr>
              <td class="text">${p.name} (${p.symbol})</td>
              <td>${p.shares.toLocaleString('ja-JP')}</td>
              <td>${yen(p.avgEntryPrice)}</td>
              <td>${yen(p.currentPrice)}</td>
              <td>${yen(p.marketValue)}</td>
              <td class="${posNeg(p.unrealizedPnl)}">${signedYen(p.unrealizedPnl)}</td>
              <td>${p.tranchesHeld}/3</td>
              <td>${p.firstEntryDate}</td>
            </tr>`,
        );

        makeSortable(
          'tradesTable',
          d.trades.slice().reverse(),
          ['date', 'action', 'name', 'shares', 'price', 'realizedPnl', 'reason'],
          (t) => `
            <tr>
              <td class="text">${t.date}</td>
              <td class="text">${t.action === 'buy' ? (TRANCHE_LABEL[t.trancheNumber] ?? '買い') : '売り'}</td>
              <td class="text">${t.name} (${t.symbol})</td>
              <td>${t.shares.toLocaleString('ja-JP')}</td>
              <td>${yen(t.price)}</td>
              <td class="${posNeg(t.realizedPnl)}">${t.realizedPnl === undefined ? '—' : signedYen(t.realizedPnl - (t.tax ?? 0))}</td>
              <td class="text reason">${extractRuleTag(t.reason)}</td>
            </tr>`,
        );
      }

      main().catch((err) => {
        document.getElementById('updated').textContent = 'データの読み込みに失敗しました: ' + err;
      });
    </script>
  </body>
</html>
