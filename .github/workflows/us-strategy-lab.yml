name: US strategy lab

# daytrade-sim-us.ymlと同じく米国市場の引け後1回だけ実行する（30戦略×122
# 候補の日足データはどのみち1日1回しか更新されないため、crypto-strategy-lab
# のような15分おきのチェックは不要）。daytrade-sim-us.ymlの20:20 UTCと同じ
# ジョブが同時に走らないよう5分ずらして20:25 UTCに設定。DST非対応の限界は
# daytrade-sim-us.ymlの同日コメントと同じ。
on:
  schedule:
    - cron: '25 20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us-strategy-lab
  cancel-in-progress: false

jobs:
  us-strategy-lab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # See daytrade-sim.yml's Checkout step for why: github.sha can be a
          # few minutes stale given how frequently the daytrade-sim*/
          # strategy-lab workflows commit to main.
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run US strategy lab
        run: npm run us-strategy-lab:run
        env:
          DISCORD_WEBHOOK_DAYTRADE: ${{ secrets.DISCORD_WEBHOOK_DAYTRADE }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/us-strategy-lab-*.json docs/us-strategy-lab/data.json
          if git diff --cached --quiet; then
            echo "No state changes to commit"
          else
            # Deliberately not tagged with the CI-skip commit marker — see the
            # same-dated comment in daytrade-sim.yml's commit step.
            git commit -m "chore: update us-strategy-lab state"
            # See daytrade-sim.yml's commit step for why this retries instead
            # of a single pull --rebase && push.
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                break
              fi
              if [ "$i" = "5" ]; then
                echo "::error::failed to push after 5 attempts"
                exit 1
              fi
              echo "push attempt $i failed, retrying after re-fetch..."
              git rebase --abort 2>/dev/null || true
              sleep $((i * 3))
            done
          fi
